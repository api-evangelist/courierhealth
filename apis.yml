aid: courierhealth
name: Courier Health
description: >-
  Courier Health is the patient experience platform for life sciences and biopharma.
  It gives pharmaceutical patient services, market access, and field reimbursement
  teams a single command center to manage the patient journey from prescription
  through long-term treatment adherence, using AI-generated patient summaries,
  workflow automation and orchestration, and integration of data across systems and
  partners. The company reports gains in patient starts, six-month persistency, and
  team productivity, and delivers the product as a HIPAA-compliant, SOC 2 Type II
  SaaS platform. Courier Health is backed by Norwest Venture Partners. No public
  developer or API surface was found during enrichment; this profile captures the
  company identity and its published security/compliance posture.
